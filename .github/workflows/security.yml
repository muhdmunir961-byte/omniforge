name: Security and dependencies
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize security analysis
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze code
        uses: github/codeql-action/analyze@v4
  python-vulnerability-audit:
    name: Audit pinned Python test dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit declared development requirements
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: Check installed runtime dependencies
        run: |
          python -m pip install -e .
          python -m pip_audit --progress-spinner off
  secret-patterns:
    name: Scan tracked source for high-confidence keys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source without uploading file contents
        run: python scripts/secret_scan.py
