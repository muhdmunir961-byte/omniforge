name: Website UX browser checks
on:
  push:
    paths:
      - 'web-preview/**'
      - '.github/workflows/showcase-ui.yml'
  pull_request:
    paths:
      - 'web-preview/**'
      - '.github/workflows/showcase-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install pytest==9.1.1 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check JavaScript parses
        run: |
          node --check web-preview/showcase.js
          node --check web-preview/app.js
          node --check web-preview/data.js
      - name: Test real Chromium desktop and mobile journeys
        run: python -m pytest -vv web-preview/tests/test_showcase_browser.py
