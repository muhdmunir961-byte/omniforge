name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Test and static compilation
        run: |
          python -m pytest -q
          python -m compileall -q src
      - name: CLI smoke
        run: |
          omniforge doctor
          omniforge search "network api"
          omniforge related "sqlite database"
          omniforge plan "debug python errors"
          omniforge budget
          ofprov --help
          omniforge provenance init --help
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node syntax and smoke tests
        run: |
          node --check vscode-extension/extension.js
          node vscode-extension/tests/smoke.js
