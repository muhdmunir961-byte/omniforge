name: Publish audited OmniForge upgrade
on:
  push:
    paths:
      - '.bootstrap/part-5'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and extract source
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, lzma, tarfile
          bundle = base64.b64decode(''.join(Path(f'.bootstrap/part-{i}').read_text().strip() for i in range(1,6)), validate=True)
          expected = 'caa4bdce5b897f76e64af8efc96bf00ea33d23f51f445f1168209d8b4068bda1'
          if hashlib.sha256(bundle).hexdigest() != expected:
              raise SystemExit('Upgrade archive SHA256 mismatch')
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(bundle)), mode='r:') as tar:
              members = tar.getmembers()
              seen = set()
              for item in members:
                  path = PurePosixPath(item.name)
                  if (not item.isfile() or path.is_absolute() or '..' in path.parts
                      or not path.parts or path.parts[0] in {'.git', '.bootstrap'}
                      or item.name in seen):
                      raise SystemExit('Unsafe or duplicated archive path')
                  seen.add(item.name)
              if len(members) != 31:
                  raise SystemExit('Expected 31 source files')
              tar.extractall(path='.', members=members, filter='data')
          PY
      - name: Run Python 3.11+ core tests
        run: |
          python -m pip install -e . pytest
          python -m pytest -q
      - name: Verify VS Code extension source
        run: |
          node --check vscode-extension/extension.js
          node vscode-extension/tests/smoke.js
      - name: Publish source and remove bootstrap material
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/publish-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add OmniForge 1.1 permissioned agents, browser, search and VS Code integration'
          git push origin HEAD:main
