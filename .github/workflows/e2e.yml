name: Real Integrations E2E
on:
  push:
    paths:
      - 'src/**'
      - 'tests/test_live_integrations.py'
      - '.github/workflows/e2e.yml'
      - 'vscode-extension/**'
      - 'pyproject.toml'
      - 'tests/test_blockchain_evm.py'
      - 'tests/test_blockchain.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OmniForge, pytest and Chromium
        run: |
          python -m pip install -e . pytest playwright
          python -m playwright install --with-deps chromium
      - name: Real browser and mock model HTTP tests
        env:
          OMNIFORGE_LIVE: '1'
        run: python -m pytest -vv tests/test_live_integrations.py -k 'not docker'
  docker-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OmniForge and prepare isolated Docker image
        run: |
          python -m pip install -e . pytest
          docker info
          docker pull python:3.13-alpine
      - name: Real Docker sandbox integration test
        env:
          OMNIFORGE_LIVE: '1'
        run: python -m pytest -vv -s --tb=long tests/test_live_integrations.py -k docker
  vscode-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extension syntax and command registration
        run: |
          node --check vscode-extension/extension.js
          node vscode-extension/tests/smoke.js
      - name: Package local VS Code extension
        working-directory: vscode-extension
        run: |
          npm exec --yes --package @vscode/vsce -- vsce package --no-dependencies -o /tmp/omniforge-test.vsix
          test -s /tmp/omniforge-test.vsix
  vscode-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python CLI
        run: python -m pip install -e .
      - name: Install VS Code Extension Test Host
        working-directory: vscode-extension
        run: npm install --no-save --no-package-lock @vscode/test-electron
      - name: Real VS Code editor host integration
        working-directory: vscode-extension
        run: xvfb-run -a node tests/run-host.js
  blockchain-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OmniForge and disposable Foundry Anvil node
        run: |
          python -m pip install -e . pytest
          npm install --no-save --no-package-lock @foundry-rs/anvil@1.7.1
      - name: Real blockchain transaction and verification (local Anvil only)
        env:
          OMNIFORGE_CHAIN_LIVE: '1'
        run: |
          npx --yes @foundry-rs/anvil@1.7.1 --host 127.0.0.1 --port 8545 --chain-id 1337 --accounts 1 > /tmp/omniforge-anvil.log 2>&1 &
          evm_pid=$!
          trap 'kill "$evm_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          endpoint = 'http://127.0.0.1:8545'
          for attempt in range(80):
              request = urllib.request.Request(endpoint,
                  json.dumps({'jsonrpc':'2.0','id':1,'method':'eth_chainId','params':[]}).encode(),
                  {'Content-Type':'application/json'}, method='POST')
              try:
                  with urllib.request.urlopen(request, timeout=2) as response:
                      assert int(json.load(response)['result'],16) == 1337
                  break
              except (OSError, KeyError):
                  time.sleep(.25)
          else:
              print(Path('/tmp/omniforge-anvil.log').read_text()[-6000:])
              raise SystemExit('Local Anvil RPC failed to start')
          PY
          python -m pytest -vv tests/test_blockchain_evm.py
